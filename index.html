// ─── PUZZLE RESOLVER ──────────────────────────────────────────────────────────
// Returns today's puzzle in the format the game engine expects,
// or null if beyond 50 days.
const resolveTodaysPuzzle = () => {
  const idx = getDayIndex();
  if (idx < 0 || idx >= PUZZLES.length) return null;
  const raw = PUZZLES[idx];
  // Normalize to internal format: color keys y/r/b/p, words array
  const categories = raw.groups.map(g => ({
    color: g.color,
    name: g.name,
    words: g.items,
  }));
  return { categories, dayIndex: idx };
};

const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const tileFontSize = w => {
  if (w.length <= 4)  return "clamp(0.82rem,2.2vw,1.05rem)";
  if (w.length <= 6)  return "clamp(0.7rem,1.9vw,0.9rem)";
  if (w.length <= 9)  return "clamp(0.58rem,1.6vw,0.76rem)";
  return "clamp(0.46rem,1.3vw,0.62rem)";
};
const todayStr = () => {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,"0")} / ${String(d.getMonth()+1).padStart(2,"0")} / ${d.getFullYear()}`;
};

// ─── STREAK ───────────────────────────────────────────────────────────────────
const loadStreak = () => {
  try {
    const d = JSON.parse(localStorage.getItem("mimir5") || "{}");
    const today = getISTDateString();
    const yest  = new Date(new Date(today).getTime() - 86400000).toISOString().split("T")[0];
    if (d.date === today) return d.streak || 1;
    if (d.date === yest)  return d.streak || 0;
    return 0;
  } catch { return 0; }
};
const saveWin = () => {
  try {
    const today = getISTDateString();
    const yest  = new Date(new Date(today).getTime() - 86400000).toISOString().split("T")[0];
    const d = JSON.parse(localStorage.getItem("mimir5") || "{}");
    const s = d.date === today ? d.streak : d.date === yest ? (d.streak || 0) + 1 : 1;
    localStorage.setItem("mimir5", JSON.stringify({ date: today, streak: s }));
    return s;
  } catch { return 1; }
};

// ─── POLAROID CANVAS ─────────────────────────────────────────────────────────
const buildPolaroid = (streak, elapsed, location, photoImg) =>
  new Promise(resolve => {
    const W = 1080, H = 1280;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const c = cv.getContext("2d");
    const draw = () => {
      c.fillStyle = "#FEFCF8"; c.fillRect(0, 0, W, H);
      const border = 42, bottomBorder = 210;
      const photoX = border, photoY = border;
      const photoW = W - border * 2, photoH = H - border - bottomBorder;
      if (photoImg) {
        c.save(); c.beginPath(); c.rect(photoX, photoY, photoW, photoH); c.clip();
        const iw = photoImg.naturalWidth || photoImg.width, ih = photoImg.naturalHeight || photoImg.height;
        const sc = Math.max(photoW / iw, photoH / ih);
        c.drawImage(photoImg, photoX + (photoW - iw*sc)/2, photoY + (photoH - ih*sc)/2, iw*sc, ih*sc);
        c.restore();
      } else { c.fillStyle = "#1A1218"; c.fillRect(photoX, photoY, photoW, photoH); }
      c.save(); c.beginPath(); c.rect(photoX, photoY, photoW, photoH); c.clip();
      c.fillStyle = "rgba(255,210,120,0.12)"; c.fillRect(photoX, photoY, photoW, photoH);
      const crush = c.createLinearGradient(photoX, photoY+photoH*0.55, photoX, photoY+photoH);
      crush.addColorStop(0,"rgba(10,5,20,0)"); crush.addColorStop(1,"rgba(10,5,20,0.50)");
      c.fillStyle = crush; c.fillRect(photoX, photoY, photoW, photoH);
      const vig = c.createRadialGradient(photoX+photoW/2,photoY+photoH/2,photoH*0.22,photoX+photoW/2,photoY+photoH/2,photoH*0.78);
      vig.addColorStop(0,"rgba(0,0,0,0)"); vig.addColorStop(0.7,"rgba(0,0,0,0.18)"); vig.addColorStop(1,"rgba(0,0,0,0.60)");
      c.fillStyle = vig; c.fillRect(photoX, photoY, photoW, photoH);
      c.restore();
      for (let p = 0; p < 2; p++) {
        const st = p===0?2:1, al = p===0?0.042:0.022;
        for (let gx=photoX; gx<photoX+photoW; gx+=st)
          for (let gy=photoY; gy<photoY+photoH; gy+=st)
            if (Math.random()>0.55){const v=Math.random();c.fillStyle=v>0.5?`rgba(255,255,255,${al*(v-0.5)*4})`:`rgba(0,0,0,${al*(0.5-v)*4})`;c.fillRect(gx,gy,st,st);}
      }
      const sY = photoY + photoH, cx_ = W / 2;
      c.save(); c.font="400 54px Caveat,cursive"; c.fillStyle="#2C2016"; c.textAlign="left"; c.textBaseline="middle";
      c.fillText(`Streak  ${streak}`, border+24, sY+bottomBorder*0.28); c.restore();
      c.save(); c.font="400 52px Caveat,cursive"; c.fillStyle="#2C2016"; c.textAlign="right"; c.textBaseline="middle";
      c.fillText(todayStr(), W-border-24, sY+bottomBorder*0.28); c.restore();
      c.save(); c.font="500 100px Caveat,cursive"; c.fillStyle="#1A1410"; c.textAlign="center"; c.textBaseline="middle";
      c.fillText(fmt(elapsed), cx_, sY+bottomBorder*0.62); c.restore();
      c.save(); c.font="400 44px Caveat,cursive"; c.fillStyle="#7A6040"; c.textAlign="left"; c.textBaseline="middle";
      c.fillText((location||"India").toUpperCase(), border+24, sY+bottomBorder*0.88); c.restore();
      const sX=W-border-24-68, sY_=sY+bottomBorder*0.65, sR=62, ink="rgba(160,28,28,0.60)";
      c.beginPath(); c.arc(sX,sY_,sR,0,Math.PI*2); c.strokeStyle=ink; c.lineWidth=4.5; c.stroke();
      c.beginPath(); c.arc(sX,sY_,sR-13,0,Math.PI*2); c.strokeStyle=ink; c.lineWidth=2; c.stroke();
      c.save(); c.font="500 36px Caveat,cursive"; c.fillStyle=ink; c.textAlign="center"; c.textBaseline="middle"; c.fillText("MIMIR",sX,sY_-3); c.restore();
      c.beginPath(); c.arc(sX,sY_+20,3,0,Math.PI*2); c.fillStyle=ink; c.fill();
      for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,dist=sR+(Math.random()-0.5)*8;c.beginPath();c.arc(sX+Math.cos(a)*dist,sY_+Math.sin(a)*dist,Math.random()*2.5,0,Math.PI*2);c.fillStyle=`rgba(160,28,28,${0.14+Math.random()*0.28})`;c.fill();}
      const id=c.getImageData(0,0,W,H),px=id.data;
      for(let i=0;i<px.length;i+=4){const n=(Math.random()-0.5)*7;px[i]=Math.min(255,Math.max(0,px[i]+n));px[i+1]=Math.min(255,Math.max(0,px[i+1]+n));px[i+2]=Math.min(255,Math.max(0,px[i+2]+n));}
      c.putImageData(id,0,0);
      resolve(cv.toDataURL("image/jpeg",0.94));
    };
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("400 100px Caveat"),document.fonts.load("500 100px Caveat")]).then(draw).catch(draw);
    } else { setTimeout(draw, 500); }
  });

    cursor:pointer; outline:none; -webkit-appearance:none; appearance:none;
    box-shadow:0 0 0 2px #E8950A, 0 0 0 5px #FFD700, 0 0 0 8px #1A0820, 0 0 0 11px #CC2200, 7px 7px 0 11px rgba(0,0,0,0.5);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
    animation:playEnter 0.8s 0.85s cubic-bezier(0.34,1.56,0.64,1) both;
    z-index:5;
  }
  .mi-play::before { content:''; position:absolute; inset:7px; border:1.5px solid rgba(255,215,0,0.3); pointer-events:none; }
  .mi-play:hover  { transform:translate(-4px,-4px); box-shadow:0 0 0 2px #E8950A,0 0 0 5px #FFD700,0 0 0 8px #1A0820,0 0 0 11px #CC2200,11px 11px 0 11px rgba(0,0,0,0.5); }
  .mi-play:active { transform:translate(4px,4px);  box-shadow:0 0 0 2px #E8950A,0 0 0 5px #FFD700,0 0 0 8px #1A0820,0 0 0 11px #CC2200,2px 2px 0 11px rgba(0,0,0,0.5); }
  .mi-play:focus-visible { outline:3px solid #4EC9E1; outline-offset:8px; }

  @keyframes playEnter { from{opacity:0;transform:translateY(32px) scale(0.88);} to{opacity:1;transform:translateY(0) scale(1);} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

  /* ════════════════════════════════════════════════════
     GAME
  ════════════════════════════════════════════════════ */
  .mi-game {
    min-height:100vh; width:100%;
    background:#D4580A;
    background-image:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 36px,rgba(0,0,0,0.055) 36px,rgba(0,0,0,0.055) 40px);
    display:flex; flex-direction:column; align-items:center;
  }
  .mi-game-inner {
    width:100%; max-width:520px; flex:1;
    display:flex; flex-direction:column; align-items:center;
    gap:12px;
    padding:40px 18px 32px;
    /* Fill vertical space so nothing feels empty */
    justify-content:flex-start;
  }

  /* Header strip: game title + timer */
  .mi-game-header {
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:0 2px; margin-bottom:4px;
  }
  .mi-game-logo {
    font-family:'Lilita One',sans-serif; font-size:1.1rem; letter-spacing:5px;
    color:#FFD700; text-shadow:1px 1px 0 rgba(0,0,0,0.4);
  }
  .mi-game-timer {
    font-size:0.76rem; font-weight:800; color:rgba(255,255,255,0.45);
    letter-spacing:1.5px; font-variant-numeric:tabular-nums;
  }

  /* Solved rows — sweep in like tiles formed the line */
  .mi-solved-row {
    width:100%; border-radius:7px; padding:13px 18px; text-align:center;
    position:relative; overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.12);
    animation:rowSweep 0.6s cubic-bezier(0.34,1.3,0.64,1) both;
  }
  .mi-solved-row::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(135deg,rgba(255,255,255,0.06) 0 4px,transparent 4px 12px); pointer-events:none; }
  .mi-solved-name  { font-size:0.6rem; font-weight:800; letter-spacing:3px; text-transform:uppercase; opacity:0.82; margin-bottom:4px; }
  .mi-solved-words { font-family:'Lilita One',sans-serif; font-size:0.98rem; letter-spacing:0.5px; }
  @keyframes rowSweep { from{transform:scaleX(0) translateX(-20px);opacity:0;} to{transform:scaleX(1) translateX(0);opacity:1;} }

  /* ── Tile grid ── */
  .mi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; }
  .mi-grid.shake { animation:gShake 0.5s ease; }
  @keyframes gShake { 0%,100%{transform:translateX(0)} 15%{transform:translateX(-10px)} 30%{transform:translateX(9px)} 48%{transform:translateX(-7px)} 64%{transform:translateX(6px)} 80%{transform:translateX(-3px)} 92%{transform:translateX(2px)} }

  .mi-tile {
    position:relative; width:100%; padding-bottom:116%;
    border-radius:6px;
    background:linear-gradient(160deg,#1E0A30 0%,#150520 100%);
    border:2px solid rgba(233,30,140,0.55);
    box-shadow:0 3px 0 rgba(80,0,40,0.8),0 5px 16px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08);
    cursor:pointer; user-select:none;
    transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.2s ease,background 0.15s ease;
  }
  .mi-tile::before { content:''; position:absolute; inset:3px; border:1px solid rgba(255,215,0,0.12); border-radius:4px; pointer-events:none; z-index:1; }
  .mi-tile-inner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:5px 4px; text-align:center; pointer-events:none; z-index:2; }
  .mi-tile-word  { font-family:'Lilita One','Arial Black',Arial,sans-serif; color:#F5EED8; line-height:1.18; word-break:break-word; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  @media(hover:hover){.mi-tile:not(.sel):not(.flying):hover{transform:translateY(-6px) scale(1.03);box-shadow:0 8px 0 rgba(80,0,40,0.8),0 14px 24px rgba(0,0,0,0.45);border-color:rgba(233,30,140,0.8);}}
  .mi-tile.sel { background:linear-gradient(160deg,#FFD700 0%,#F0A800 100%); border-color:#CC0000; transform:translateY(-10px) scale(1.06); box-shadow:0 14px 0 rgba(120,50,0,0.6),0 18px 32px rgba(255,180,0,0.4); }
  .mi-tile.sel .mi-tile-word { color:#1A0820; text-shadow:none; }

  /* FLYING — tiles animate upward to join the row */
  .mi-tile.flying {
    animation:tileFlying 0.55s cubic-bezier(0.55,0,1,0.45) forwards;
    pointer-events:none;
    z-index:10;
  }
  @keyframes tileFlying {
    0%   { transform:translateY(-10px) scale(1.06); opacity:1; background:#FFD700; }
    30%  { transform:translateY(-30px) scale(1.1); opacity:1; }
    70%  { transform:translateY(-80px) scaleX(1.8) scaleY(0.5); opacity:0.7; }
    100% { transform:translateY(-140px) scaleX(3) scaleY(0); opacity:0; }
  }

  /* ── Mistake dots ── */
  .mi-mistakes { display:flex; gap:8px; align-items:center; }
  .mi-mistake-dot { width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,0.22); border:1.5px solid rgba(255,215,0,0.4); transition:background 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .mi-mistake-dot.used { background:#E8500A; border-color:#FF8050; transform:scale(1.15); }

  /* ── Bottom fill area — decorative strip so no empty space ── */
  .mi-game-footer {
    width:100%; margin-top:auto;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding-top:20px;
  }
  .mi-footer-dots { display:flex; gap:10px; }
  .mi-footer-dot  { width:10px; height:10px; border-radius:50%; opacity:0.5; }
  .mi-footer-divider { width:100%; height:1px; background:rgba(255,215,0,0.18); }

  /* ── Buttons ── */
  .mi-btn-row  { display:flex; gap:12px; }
  .mi-deselect { padding:12px 24px; border-radius:6px; border:2px solid rgba(255,215,0,0.5); background:rgba(255,215,0,0.08); color:rgba(255,215,0,0.85); font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.84rem; letter-spacing:0.5px; cursor:pointer; transition:background 0.15s ease; -webkit-appearance:none; appearance:none; }
  .mi-deselect:hover { background:rgba(255,215,0,0.15); }
  .mi-submit   { padding:12px 44px; border-radius:6px; border:2.5px solid #FFD700; background:linear-gradient(135deg,#CC0000,#8B0000); color:#FFD700; font-family:'Lilita One',sans-serif; font-size:1.15rem; letter-spacing:4px; cursor:pointer; box-shadow:4px 4px 0 #FFD700; transition:transform 0.12s ease,box-shadow 0.12s ease; -webkit-appearance:none; appearance:none; }
  .mi-submit:hover:not(:disabled)  { transform:translate(-2px,-2px); box-shadow:6px 6px 0 #FFD700; }
  .mi-submit:active:not(:disabled) { transform:translate(3px,3px); box-shadow:1px 1px 0 #FFD700; }
  .mi-submit:disabled { background:rgba(255,255,255,0.1); border-color:rgba(255,215,0,0.25); color:rgba(255,215,0,0.28); box-shadow:2px 2px 0 rgba(255,215,0,0.18); cursor:not-allowed; }

  /* ── Toast — bottom ── */
  .mi-toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%); background:#1A0820; color:#FFD700; padding:11px 26px; border-radius:40px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.88rem; letter-spacing:0.5px; z-index:9999; box-shadow:0 0 0 2px #E91E8C,0 0 0 4px rgba(255,215,0,0.6),0 -8px 32px rgba(0,0,0,0.5); white-space:nowrap; pointer-events:none; animation:toastUp 0.38s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes toastUp { from{opacity:0;transform:translateX(-50%) translateY(16px) scale(0.88);} to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);} }

  /* ════════════════════════════════════════════════════
     WIN MODAL
  ════════════════════════════════════════════════════ */
  .mi-overlay { position:fixed; inset:0; z-index:800; background:rgba(10,5,20,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; animation:ovIn 0.28s ease; }
  @keyframes ovIn { from{opacity:0;} to{opacity:1;} }
  .mi-win-card { position:relative; width:100%; max-width:364px; background:#FEFCF8; border-radius:18px; padding:36px 26px 28px; box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,215,0,0.2); animation:cardPop 0.42s cubic-bezier(0.34,1.3,0.64,1); max-height:92vh; overflow-y:auto; }
  @keyframes cardPop { from{transform:scale(0.86);opacity:0;} to{transform:scale(1);opacity:1;} }
  .mi-win-close { position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; background:#F0ECE4; border:none; color:#7A5A3A; font-size:13px; font-weight:700; font-family:sans-serif; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.15s; }
  .mi-win-close:hover { background:#E5DDD0; }
  .mi-win-name { font-family:'Lilita One',sans-serif; font-size:1.6rem; letter-spacing:8px; color:#1A0820; text-align:center; margin-bottom:20px; text-shadow:1px 1px 0 rgba(255,215,0,0.5),2px 2px 0 rgba(204,0,0,0.2); }
  .mi-rule { display:flex; height:4px; gap:2px; border-radius:2px; overflow:hidden; margin-bottom:22px; }
  .mi-rule div { flex:1; }
  .mi-mini-grid { display:flex; flex-direction:column; align-items:center; gap:5px; margin-bottom:22px; }
  .mi-mini-row  { display:flex; gap:5px; }
  .mi-mini-sq   { width:28px; height:28px; border-radius:5px; }
  .mi-stats { display:grid; grid-template-columns:1fr 1fr 1fr; border-radius:12px; overflow:hidden; margin-bottom:22px; background:#F5F0E8; border:1.5px solid #E8DDD0; }
  .mi-stat  { padding:16px 8px; text-align:center; border-right:1px solid #E8DDD0; }
  .mi-stat:last-child { border-right:none; }
  .mi-stat-val { font-family:'Lilita One',sans-serif; font-size:1.7rem; color:#1A0820; line-height:1; margin-bottom:4px; }
  .mi-stat-lbl { font-size:0.56rem; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; color:#B0987A; }
  .mi-loc-wrap  { margin-bottom:18px; }
  .mi-loc-label { font-size:0.6rem; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:#B0987A; margin-bottom:6px; display:block; }
  .mi-loc-input { width:100%; padding:11px 14px; border:1.5px solid #E8DDD0; border-radius:8px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.9rem; color:#1A0820; background:#FEFCF8; outline:none; transition:border-color 0.15s ease; -webkit-appearance:none; appearance:none; }
  .mi-loc-input:focus { border-color:#8B0000; }
  .mi-pol-btn { width:100%; padding:16px; border-radius:10px; border:2px solid #1A0820; background:#1A0820; color:#FFD700; font-family:'Lilita One',sans-serif; font-size:1rem; letter-spacing:4px; cursor:pointer; box-shadow:3px 3px 0 rgba(255,215,0,0.4); transition:transform 0.12s ease,box-shadow 0.12s ease; display:flex; align-items:center; justify-content:center; gap:10px; -webkit-appearance:none; appearance:none; }
  .mi-pol-btn:hover  { transform:translate(-2px,-2px); box-shadow:5px 5px 0 rgba(255,215,0,0.5); }
  .mi-pol-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(255,215,0,0.3); }

  /* ════════════════════════════════════════════════════
     PHOTOBOOTH
  ════════════════════════════════════════════════════ */
  .pb-overlay { position:fixed; inset:0; z-index:900; background:#0E0A06; background-image:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(40,20,8,0.9) 0%,#0E0A06 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; animation:ovIn 0.35s ease; }
  .pb-glow { position:absolute; width:340px; height:340px; background:radial-gradient(ellipse,rgba(255,215,0,0.12) 0%,transparent 70%); top:50%; left:50%; transform:translate(-50%,-58%); pointer-events:none; }
  .pb-stage { display:flex; flex-direction:column; align-items:center; position:relative; animation:boothArrive 0.7s cubic-bezier(0.34,1.3,0.64,1) both; }
  @keyframes boothArrive { from{opacity:0;transform:translateY(-60px) scale(0.92);} to{opacity:1;transform:translateY(0) scale(1);} }
  .pb-machine { width:min(260px,80vw); background:linear-gradient(180deg,#1E1030 0%,#12081E 100%); border:3px solid #E91E8C; box-shadow:0 0 0 1px rgba(255,215,0,0.3),0 0 0 5px #1A0820,0 0 0 7px #FFD700,0 24px 60px rgba(0,0,0,0.9),0 4px 20px rgba(233,30,140,0.3); border-radius:20px; overflow:hidden; position:relative; z-index:2; }
  .pb-sign-wrap { background:linear-gradient(180deg,#2A1840,#1A0E2E); padding:12px 10px 8px; display:flex; align-items:center; justify-content:center; gap:5px; border-bottom:2px solid rgba(255,215,0,0.3); position:relative; overflow:hidden; }
  .pb-sign-wrap::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 100% at 50% 0%,rgba(255,215,0,0.15) 0%,transparent 70%); pointer-events:none; }
  .pb-sign-text { font-family:'Lilita One',sans-serif; font-size:1.4rem; letter-spacing:8px; color:#FFD700; text-shadow:0 0 12px rgba(255,215,0,0.9),0 0 24px rgba(255,215,0,0.5); padding:0 8px; }
  .pb-sign-bulbs { display:flex; gap:4px; align-items:center; }
  .pb-bulb { width:6px; height:6px; border-radius:50%; background:#FFD700; box-shadow:0 0 6px rgba(255,215,0,0.9); animation:bulbFlicker 2s ease-in-out infinite; }
  @keyframes bulbFlicker { 0%,100%{opacity:1;} 45%{opacity:0.6;} 50%{opacity:1;} 75%{opacity:0.8;} }
  .pb-body { padding:10px 12px 10px; }
  .pb-cat-stripe { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:10px; }
  .pb-cat-stripe div { flex:1; }
  .pb-sparkle-row { display:flex; justify-content:center; gap:10px; margin-bottom:8px; }
  .pb-spark { font-size:0.7rem; color:#FFD700; animation:sparkPulse 1.5s ease-in-out infinite; text-shadow:0 0 6px rgba(255,215,0,0.8); }
  @keyframes sparkPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.8);} }
  .pb-screen { background:#06040E; border-radius:8px; border:2px solid #2E2050; padding:10px; margin-bottom:8px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.8); }
  .pb-screen-label { font-size:0.5rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.22); text-align:center; margin-bottom:7px; }
  .pb-screen-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; }
  .pb-screen-cell { aspect-ratio:1; border-radius:2px; animation:cellGlow 0.6s ease both; }
  .pb-screen-cell:nth-child(1){animation-delay:0.05s}.pb-screen-cell:nth-child(2){animation-delay:0.1s}.pb-screen-cell:nth-child(3){animation-delay:0.15s}.pb-screen-cell:nth-child(4){animation-delay:0.2s}.pb-screen-cell:nth-child(5){animation-delay:0.25s}.pb-screen-cell:nth-child(6){animation-delay:0.3s}.pb-screen-cell:nth-child(7){animation-delay:0.35s}.pb-screen-cell:nth-child(8){animation-delay:0.4s}.pb-screen-cell:nth-child(9){animation-delay:0.45s}.pb-screen-cell:nth-child(10){animation-delay:0.5s}.pb-screen-cell:nth-child(11){animation-delay:0.55s}.pb-screen-cell:nth-child(12){animation-delay:0.6s}.pb-screen-cell:nth-child(13){animation-delay:0.65s}.pb-screen-cell:nth-child(14){animation-delay:0.7s}.pb-screen-cell:nth-child(15){animation-delay:0.75s}.pb-screen-cell:nth-child(16){animation-delay:0.8s}
  @keyframes cellGlow { from{opacity:0;transform:scale(0.5);} to{opacity:1;transform:scale(1);} }
  .pb-body-text { font-family:'Lilita One',sans-serif; font-size:0.85rem; letter-spacing:3px; color:#FFD700; text-align:center; text-shadow:0 0 10px rgba(255,215,0,0.6); margin-bottom:8px; }
  .pb-slot-bezel { background:#0E0820; border-radius:6px; border:2px solid rgba(255,215,0,0.2); box-shadow:inset 0 3px 10px rgba(0,0,0,0.9),inset 0 1px 0 rgba(255,255,255,0.04); padding:4px 16px; margin-bottom:6px; }
  .pb-slot-opening { height:10px; background:#04020A; border-radius:3px; border-top:1px solid rgba(255,215,0,0.1); position:relative; overflow:hidden; }
  .pb-slot-shadow { position:absolute; inset:0; background:linear-gradient(90deg,rgba(255,215,0,0.06) 0%,transparent 30%,transparent 70%,rgba(255,215,0,0.06) 100%); }
  .pb-bottom-dots { display:flex; justify-content:center; gap:5px; }
  .pb-bot-dot { width:5px; height:5px; border-radius:50%; background:rgba(233,30,140,0.4); }
  .pb-eject-wrap { width:min(210px,64vw); position:relative; margin-top:-4px; z-index:1; }
  .pb-eject-photo { width:100%; display:block; border-radius:0 0 3px 3px; box-shadow:0 16px 48px rgba(0,0,0,0.9); transform:rotate(-6deg) translateY(-85%); clip-path:inset(0 0 100% 0); transition:transform 1.4s cubic-bezier(0.22,1,0.36,1),clip-path 1.2s cubic-bezier(0.22,1,0.36,1); }
  .pb-eject-photo.out { transform:rotate(-6deg) translateY(-30%); clip-path:inset(0 0 30% 0); }

  /* ════════════════════════════════════════════════════
     POLAROID VIEW
  ════════════════════════════════════════════════════ */
  .mi-pol-screen { position:fixed; inset:0; z-index:900; background:#080808; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px 36px; overflow:hidden; animation:ovIn 0.3s ease; }
  .mi-pol-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; max-width:300px; transform:rotate(-1.8deg); animation:polIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both; }
  @keyframes polIn { from{opacity:0;transform:rotate(-1.8deg) translateY(44px) scale(0.86);} to{opacity:1;transform:rotate(-1.8deg) translateY(0) scale(1);} }
  .mi-pol-img { width:100%; display:block; border-radius:2px; box-shadow:0 30px 80px rgba(0,0,0,0.95); -webkit-touch-callout:default; pointer-events:auto; }
  .mi-pol-hint { margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:300px; }
  .mi-pol-pill { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:40px; padding:10px 20px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.78rem; letter-spacing:0.5px; color:rgba(255,255,255,0.6); text-align:center; line-height:1.6; }
  .mi-pol-pill strong { color:#fff; }
  .mi-pol-back {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50px;
    color: #fff;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    padding: 14px 44px;
    width: 100%;
    max-width: 300px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .mi-pol-back:hover  { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.6); }
  .mi-pol-back:active { transform: scale(0.97); }

  /* ════════════════════════════════════════════════════
     DEVELOPING
  ════════════════════════════════════════════════════ */
  .mi-developing { position:fixed; inset:0; z-index:950; background:rgba(8,5,18,0.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; animation:ovIn 0.2s ease; }
  .mi-dev-label { font-family:'Caveat',cursive; font-size:2.8rem; color:#F5EDD8; letter-spacing:3px; animation:devPulse 1.4s ease-in-out infinite; }
  @keyframes devPulse { 0%,100%{opacity:1;} 50%{opacity:0.28;} }
  .mi-dev-bar  { width:160px; height:1.5px; background:rgba(245,237,216,0.14); overflow:hidden; }
  .mi-dev-fill { height:100%; background:#F5EDD8; animation:devFill 2.2s ease forwards; }
  @keyframes devFill { from{width:0;} to{width:100%;} }

  /* ════════════════════════════════════════════════════
     END SCREEN
  ════════════════════════════════════════════════════ */
  .mi-end { min-height:100vh; width:100%; background:#E8950A; background-image:repeating-linear-gradient(170deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 38px,rgba(0,0,0,0.04) 38px,rgba(0,0,0,0.04) 40px); display:flex; flex-direction:column; align-items:center; padding:0 20px 60px; overflow:hidden; }
  .mi-end-inner { width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px; padding-top:52px; }
  .mi-end-title { font-family:'Lilita One',sans-serif; font-size:clamp(1.8rem,5vw,2.6rem); color:#1A0820; letter-spacing:5px; text-align:center; text-shadow:2px 2px 0 rgba(255,215,0,0.7),3px 3px 0 rgba(204,0,0,0.25); margin-bottom:4px; }
  .mi-end-sub   { font-size:0.82rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:rgba(26,8,32,0.5); text-align:center; margin-bottom:8px; }
  .mi-ans-row   { width:100%; border-radius:8px; padding:14px 18px; text-align:center; animation:rowSweep 0.5s ease both; box-shadow:0 3px 12px rgba(0,0,0,0.2),4px 4px 0 rgba(0,0,0,0.18); }
  .mi-ans-name  { font-size:0.58rem; font-weight:800; letter-spacing:3px; text-transform:uppercase; opacity:0.82; margin-bottom:5px; }
  .mi-ans-words { font-family:'Lilita One',sans-serif; font-size:0.92rem; letter-spacing:0.5px; }
  .mi-replay { width:100%; padding:15px; border-radius:8px; border:2.5px solid #1A0820; background:transparent; color:#1A0820; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.9rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background 0.15s ease; box-shadow:3px 3px 0 rgba(26,8,32,0.25); -webkit-appearance:none; appearance:none; }
  .mi-replay:hover { background:rgba(26,8,32,0.08); }
`;

// ─── APP ──────────────────────────────────────────────────────────────────────
function Mimir() {
  const [screen,       setScreen]      = useState("landing");
  const [PUZZLE,       setPUZZLE]      = useState(null);
  const [noMorePuzzles,setNoMore]      = useState(false);
  const [board,        setBoard]       = useState([]);
  const [selected,     setSelected]    = useState([]);
  const [solved,       setSolved]      = useState([]);
  const [flying,       setFlying]      = useState([]);
  const [chancesLeft,  setChancesLeft] = useState(4);
  const [toast,        setToast]       = useState(null);
  const [shaking,      setShaking]     = useState(false);
  const [gameOver,     setGameOver]    = useState(false);
  const [won,          setWon]         = useState(false);
  const [streak,       setStreak]      = useState(0);
  const [guessLog,     setGuessLog]    = useState([]);
  const [elapsed,      setElapsed]     = useState(0);
  const [showWin,      setShowWin]     = useState(false);
  const [location,     setLocation]    = useState("");
  const [developing,   setDeveloping]  = useState(false);
  const [polDataUrl,   setPolDataUrl]  = useState(null);
  const [showPol,      setShowPol]     = useState(false);
  const [boothPhase,   setBoothPhase]  = useState(null);

  const timerRef     = useRef(null);
  const fileInputRef = useRef(null);
  const streakRef    = useRef(0);
  const elapsedRef   = useRef(0);
  const locationRef  = useRef("");

  streakRef.current   = streak;
  elapsedRef.current  = elapsed;
  locationRef.current = location;

  // Load today's puzzle on mount + schedule auto-refresh at IST midnight
  useEffect(() => {
    setStreak(loadStreak());
    const p = resolveTodaysPuzzle();
    if (!p) { setNoMore(true); return; }
    setPUZZLE(p);

    // ms remaining until next IST midnight
    const msUntilISTMidnight = () => {
      const now = new Date();
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("en-IN", {
          timeZone:"Asia/Kolkata",
          hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
        }).formatToParts(now).map(x => [x.type, x.value])
      );
      const hh = parseInt(parts.hour), mm = parseInt(parts.minute), ss = parseInt(parts.second);
      return ((23 - hh) * 3600 + (59 - mm) * 60 + (60 - ss)) * 1000;
    };

    const t = setTimeout(() => {
      const next = resolveTodaysPuzzle();
      if (!next) setNoMore(true);
      else { setPUZZLE(next); setScreen("landing"); }
    }, msUntilISTMidnight());

    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (screen === "game" && !gameOver) {
      timerRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
    }
    return () => clearInterval(timerRef.current);
  }, [screen, gameOver]);

  const showToast = (msg, ms = 2400) => { setToast(msg); setTimeout(() => setToast(null), ms); };

  const startGame = () => {
    if (!PUZZLE) return;
    clearInterval(timerRef.current);
    setBoard(shuffle(PUZZLE.categories.flatMap(c => c.words)));
    setSelected([]); setSolved([]); setFlying([]); setChancesLeft(4);
    setShaking(false); setGameOver(false); setWon(false); setGuessLog([]);
    setElapsed(0); setShowWin(false); setDeveloping(false);
    setPolDataUrl(null); setShowPol(false); setBoothPhase(null);
    setScreen("game");
  };

  useEffect(() => {
    if (!won) return;
    clearInterval(timerRef.current);
    const ns = saveWin(); setStreak(ns); streakRef.current = ns;
    setTimeout(() => setShowWin(true), 1100);
  }, [won]);

  const solvedWordSet = new Set(PUZZLE ? PUZZLE.categories.filter(c => solved.includes(c.color)).flatMap(c => c.words) : []);
  const flyingSet     = new Set(flying);

  const toggle = w => {
    if (gameOver || flying.length || solvedWordSet.has(w)) return;
    setSelected(s => s.includes(w) ? s.filter(x => x !== w) : s.length < 4 ? [...s, w] : s);
  };

  const submit = () => {
    if (selected.length !== 4 || flying.length) return;
    const match = PUZZLE.categories.find(c =>
      !solved.includes(c.color) &&
      c.words.every(w => selected.includes(w)) &&
      selected.every(w => c.words.includes(w))
    );
    if (match) {
      const words = [...selected];
      // Tiles fly upward, then solved row sweeps in
      setFlying(words); setSelected([]);
      setTimeout(() => {
        setFlying([]);
        setGuessLog(g => [...g, match.color]);
        setSolved(prev => {
          const next = [...prev, match.color];
          if (next.length === 4) { setWon(true); setGameOver(true); }
          return next;
        });
      }, 560);
      showToast(match.name, 2000);
    } else {
      const oneAway = PUZZLE.categories.some(c =>
        !solved.includes(c.color) && selected.filter(w => c.words.includes(w)).length === 3
      );
      setGuessLog(g => [...g, "x"]);
      setChancesLeft(n => { const nc = n - 1; if (nc <= 0) setTimeout(() => setGameOver(true), 700); return nc; });
      setShaking(true); setTimeout(() => setShaking(false), 600);
      showToast(oneAway ? "One away — almost!" : "Not this one. Keep going.");
    }
  };

  const handleTakePolaroid = () => fileInputRef.current?.click();

  const handlePhotoPick = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    e.target.value = "";
    setShowWin(false); setDeveloping(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        buildPolaroid(streakRef.current, elapsedRef.current, locationRef.current || "India", img)
          .then(dataUrl => {
            setPolDataUrl(dataUrl); setDeveloping(false);
            setBoothPhase("machine");
            setTimeout(() => setBoothPhase("eject"), 1000);
            setTimeout(() => { setBoothPhase(null); setShowPol(true); }, 3600);
          })
          .catch(() => { setDeveloping(false); setShowWin(true); showToast("Could not build polaroid — try again"); });
      };
      img.onerror = () => { setDeveloping(false); setShowWin(true); showToast("Could not load image"); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const sqC = { y:"#C9920A", r:"#B82020", b:"#1055A8", p:"#5C1A8C", x:"#C0B8A8" };
  const guessRows = [];
  for (let i = 0; i < guessLog.length; i += 4) guessRows.push(guessLog.slice(i, i + 4));

  // Grid shows: unsolved tiles + tiles mid-flight (so animation plays before removal)
  const gridTiles = board.filter(w => !solvedWordSet.has(w) || flyingSet.has(w));

  // ── Coming soon screen ──
  if (noMorePuzzles) return (
    <>
      <style>{CSS}</style>
      <style>{`.mi-soon{min-height:100vh;width:100%;background:#E8950A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px}.mi-soon-title{font-family:'Lilita One',sans-serif;font-size:clamp(2rem,8vw,4rem);color:#1A0820;letter-spacing:5px;text-align:center;text-shadow:2px 2px 0 rgba(255,215,0,0.7)}.mi-soon-sub{font-family:'Caveat',cursive;font-size:clamp(1.2rem,4vw,1.8rem);color:#4A2010;text-align:center;max-width:400px;line-height:1.5}`}</style>
      <ScallopBorder/>
      <div className="mi-soon">
        <div className="mi-soon-title">MIMIR</div>
        <div style={{display:"flex",gap:12,marginBottom:8}}>
          {[CAT_LIGHT.y,CAT_LIGHT.r,CAT_LIGHT.b,CAT_LIGHT.p].map((c,i)=>(
            <div key={i} style={{width:16,height:16,borderRadius:"50%",background:c,boxShadow:`0 3px 10px ${c}99`}}/>
          ))}
        </div>
        <div className="mi-soon-sub">You've solved all 50 puzzles!<br/>New ones coming very soon.</div>
      </div>
      <ScallopBorder flip/>
    </>
  );

  return (
    <>
      <style>{CSS}</style>
      <input ref={fileInputRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handlePhotoPick}/>

      {/* ══ LANDING — India Gate collage ═══════════════════════════════ */}
      {screen === "landing" && (
        <div className="mi-landing">
          <ScallopBorder/>

          {/* SVG layered frame */}
          <svg className="mi-landing-frame" style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}>
            <rect x="38" y="38" width="calc(100% - 76px)" height="calc(100% - 76px)" rx="4" fill="none" stroke="#5C1A8C" strokeWidth="3.5"/>
            <rect x="46" y="46" width="calc(100% - 92px)" height="calc(100% - 92px)" rx="3" fill="none" stroke="#FFD700" strokeWidth="1.5"/>
          </svg>

          {/* Sky layer behind everything */}
          <div className="mi-sky-layer">
            <div className="mi-cloud" style={{width:80,height:28,top:20,left:"15%",opacity:0.9}}/>
            <div className="mi-cloud" style={{width:52,height:18,top:35,left:"55%",opacity:0.7}}/>
            <div className="mi-cloud" style={{width:68,height:22,top:12,left:"72%",opacity:0.8}}/>
          </div>

          {/* Corner folk art motifs */}
          <div style={{position:"absolute",top:44,left:44,zIndex:4}}><FolkFlower size={52} primary="#CC2200" secondary="#FFD700"/></div>
          <div style={{position:"absolute",top:44,right:44,zIndex:4}}><FolkFlower size={52} primary="#5C1A8C" secondary="#FFD700"/></div>
          <div style={{position:"absolute",bottom:44,left:44,zIndex:4}}><FolkFlower size={52} primary="#1055A8" secondary="#FFD700"/></div>
          <div style={{position:"absolute",bottom:44,right:44,zIndex:4}}><Lotus size={52} color="#CC2200" accent="#FFD700"/></div>

          {/* Paisley accents */}
          <div style={{position:"absolute",left:20,top:"38%",zIndex:3,opacity:0.7}}><Paisley size={36} color="#5C1A8C"/></div>
          <div style={{position:"absolute",right:20,top:"42%",zIndex:3,opacity:0.7,transform:"scaleX(-1)"}}><Paisley size={36} color="#B82020"/></div>

          {/* Badge — top right like India Gate reference */}
          <div className="mi-badge">
            <div className="mi-badge-text" style={{fontSize:"clamp(0.45rem,1.4vw,0.7rem)",lineHeight:1.3}}>Play<br/>Daily</div>
          </div>

          {/* Left lotus card */}
          <div className="mi-lotus-card">
            <Lotus size={clamp(48,8,72)} color="#CC2200" accent="#FFD700"/>
          </div>

          {/* Main collage content */}
          <div className="mi-collage">

            {/* MIMIR — torn paper sticker card */}
            <div className="mi-title-card">
              <div className="mi-wordmark">MIMIR</div>
            </div>

            {/* Notebook note */}
            <div className="mi-note">
              Make 4 sets of 4 words to win.
            </div>

            {/* 4 category dots */}
            <div className="mi-cat-dots">
              {[CAT_LIGHT.y, CAT_LIGHT.r, CAT_LIGHT.b, CAT_LIGHT.p].map((c, i) => (
                <div key={i} className="mi-cat-dot" style={{ background:c, boxShadow:`0 3px 10px ${c}99` }}/>
              ))}
            </div>

            <button className="mi-play" onClick={startGame}>PLAY</button>
          </div>

          {/* Bottom lotus row */}
          <div style={{position:"absolute",bottom:36,left:"50%",transform:"translateX(-50%)",display:"flex",gap:20,zIndex:4}}>
            {[0,1,2,3,4].map(i=>(
              <Lotus key={i} size={28} color={["#CC2200","#5C1A8C","#1055A8","#CC2200","#5C1A8C"][i]} accent="#FFD700"/>
            ))}
          </div>

          <ScallopBorder flip/>
        </div>
      )}

      {/* ══ GAME ═══════════════════════════════════════════════════════ */}
      {screen === "game" && (
        <div className="mi-game">
          <RainbowBand/>
          <div className="mi-game-inner">

            {/* Header */}
            <div className="mi-game-header">
              <span className="mi-game-logo">MIMIR</span>
              <span className="mi-game-timer">{fmt(elapsed)}</span>
            </div>

            {/* Solved rows */}
            {(PUZZLE ? PUZZLE.categories : []).filter(c => solved.includes(c.color)).map(cat => (
              <div key={cat.color} className="mi-solved-row"
                style={{ background:CAT_COLOR[cat.color], color:CAT_TEXT[cat.color] }}>
                <div className="mi-solved-name">{cat.name}</div>
                <div className="mi-solved-words">{cat.words.join("  ·  ")}</div>
              </div>
            ))}

            {/* Tile grid */}
            {gridTiles.length > 0 && (
              <div className={`mi-grid ${shaking ? "shake" : ""}`}>
                {gridTiles.map(w => (
                  <div key={w}
                    className={`mi-tile ${selected.includes(w) ? "sel" : ""} ${flyingSet.has(w) ? "flying" : ""}`}
                    onClick={() => toggle(w)}>
                    <div className="mi-tile-inner">
                      <span className="mi-tile-word" style={{ fontSize:tileFontSize(w) }}>{w}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Buttons */}
            {!gameOver && (
              <div className="mi-btn-row">
                <button className="mi-deselect" onClick={() => setSelected([])}>Deselect</button>
                <button className="mi-submit" onClick={submit} disabled={selected.length !== 4}>SUBMIT</button>
              </div>
            )}
            {gameOver && !won && (
              <button className="mi-submit" style={{ width:"100%", letterSpacing:"3px" }}
                onClick={() => setScreen("end")}>See Answers</button>
            )}

            {/* Footer fills the negative space below with decorative elements */}
            <div className="mi-game-footer">
              <div className="mi-footer-divider"/>
              {/* Mistake dots */}
              <div className="mi-mistakes">
                {[0,1,2,3].map(i => (
                  <div key={i} className={`mi-mistake-dot ${i >= chancesLeft ? "used" : ""}`}/>
                ))}
              </div>
              {/* Mini lotus row */}
              <div className="mi-footer-dots">
                {[CAT_COLOR.y, CAT_COLOR.r, CAT_COLOR.b, CAT_COLOR.p].map((c, i) => (
                  <div key={i} className="mi-footer-dot" style={{ background:c }}/>
                ))}
              </div>
            </div>
          </div>
          <RainbowBand flip/>
        </div>
      )}

      {/* ══ END ════════════════════════════════════════════════════════ */}
      {screen === "end" && (
        <div className="mi-end">
          <RainbowBand/>
          <div className="mi-end-inner">
            <div className="mi-end-title">The Answers</div>
            <div className="mi-end-sub">Four hidden connections</div>
            {(PUZZLE ? PUZZLE.categories : []).map((cat, i) => (
              <div key={cat.color} className="mi-ans-row"
                style={{ background:CAT_COLOR[cat.color], color:CAT_TEXT[cat.color], animationDelay:`${i*0.1}s` }}>
                <div className="mi-ans-name">{cat.name}</div>
                <div className="mi-ans-words">{cat.words.join("  ·  ")}</div>
              </div>
            ))}
            <button className="mi-replay" style={{ marginTop:8 }} onClick={startGame}>Play Again</button>
            <button className="mi-replay" onClick={() => setScreen("landing")}>Home</button>
          </div>
          <RainbowBand flip/>
        </div>
      )}

      {/* ══ WIN MODAL ══════════════════════════════════════════════════ */}
      {showWin && (
        <div className="mi-overlay" onClick={e => { if (e.target === e.currentTarget) setShowWin(false); }}>
          <div className="mi-win-card">
            <button className="mi-win-close" onClick={() => setShowWin(false)}>&#x2715;</button>
            <div className="mi-win-name">MIMIR</div>
            <div className="mi-rule">
              {[CAT_COLOR.y,CAT_COLOR.r,CAT_COLOR.b,CAT_COLOR.p].map((c,i) => <div key={i} style={{ background:c }}/>)}
            </div>
            <div className="mi-mini-grid">
              {guessRows.map((row, ri) => (
                <div key={ri} className="mi-mini-row">
                  {[...row,...Array(4-row.length).fill("_")].map((entry,ci) => (
                    <div key={ci} className="mi-mini-sq"
                      style={{ background:entry==="_"?"#E8E0D4":sqC[entry]||"#C0B8A8" }}/>
                  ))}
                </div>
              ))}
            </div>
            <div className="mi-stats">
              <div className="mi-stat"><div className="mi-stat-val">{streak}</div><div className="mi-stat-lbl">Streak</div></div>
              <div className="mi-stat"><div className="mi-stat-val">{fmt(elapsed)}</div><div className="mi-stat-lbl">Time</div></div>
              <div className="mi-stat"><div className="mi-stat-val">{4-chancesLeft}/4</div><div className="mi-stat-lbl">Chances</div></div>
            </div>
            <div className="mi-loc-wrap">
              <label className="mi-loc-label" htmlFor="mi-loc">Your city / state</label>
              <input id="mi-loc" className="mi-loc-input" type="text"
                placeholder="e.g. Delhi" value={location}
                onChange={e => setLocation(e.target.value)} maxLength={24}/>
            </div>
            <button className="mi-pol-btn" onClick={handleTakePolaroid}>
              <span style={{ fontSize:"1.1rem" }}>&#128247;</span>
              TAKE A POLAROID
            </button>
          </div>
        </div>
      )}

      {/* ══ DEVELOPING ════════════════════════════════════════════════ */}
      {developing && (
        <div className="mi-developing">
          <div className="mi-dev-label">Developing…</div>
          <div className="mi-dev-bar"><div className="mi-dev-fill"/></div>
        </div>
      )}

      {/* ══ PHOTOBOOTH ════════════════════════════════════════════════ */}
      {boothPhase && <Photobooth phase={boothPhase} polDataUrl={polDataUrl} puzzle={PUZZLE}/>}

      {/* ══ POLAROID VIEW ═════════════════════════════════════════════ */}
      {showPol && (
        <div className="mi-pol-screen">
          <div className="mi-pol-wrap">
            {polDataUrl && <img className="mi-pol-img" src={polDataUrl} alt="Your Mimir polaroid"/>}
          </div>
          <div className="mi-pol-hint">
            <div className="mi-pol-pill">
              <strong>Right-click or hold</strong> the image<br/>then choose "Save image"
            </div>
            <button className="mi-pol-back" onClick={() => { setShowPol(false); setShowWin(true); }}>← Back to Stats</button>
          </div>
        </div>
      )}

      {toast && <div className="mi-toast">{toast}</div>}
    </>
  );
}

// Helper to avoid calling clamp inside JSX without CSS
function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Mimir));
  </script>
</body>
</html>
